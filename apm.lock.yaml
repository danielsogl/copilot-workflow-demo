lsp_configs:
  angular:
    name: angular
    command: ./.github/scripts/ngserver-launch.sh
    extensionToLanguage:
      .html: html
      .ng.html: html
  css:
    name: css
    command: npx
    args:
    - -y
    - --package=vscode-langservers-extracted
    - vscode-css-language-server
    - --stdio
    extensionToLanguage:
      .css: css
      .scss: scss
  json:
    name: json
    command: npx
    args:
    - -y
    - --package=vscode-langservers-extracted
    - vscode-json-language-server
    - --stdio
    extensionToLanguage:
      .json: json
      .jsonc: jsonc
  typescript:
    name: typescript
    command: npx
    args:
    - -y
    - typescript-language-server
    - --stdio
    extensionToLanguage:
      .ts: typescript
      .tsx: typescriptreact
      .js: javascript
      .jsx: javascriptreact
      .mjs: javascript
      .cjs: javascript
  yaml:
    name: yaml
    command: npx
    args:
    - -y
    - yaml-language-server
    - --stdio
    extensionToLanguage:
      .yaml: yaml
      .yml: yaml
lsp_target_servers:
  claude:
  - angular
  - css
  - json
  - typescript
  - yaml
  copilot:
  - angular
  - css
  - json
  - typescript
  - yaml
lsp_config_provenance:
  angular: project:.
  css: project:.
  json: project:.
  typescript: project:.
  yaml: project:.

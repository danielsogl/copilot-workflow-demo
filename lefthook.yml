# Lefthook configuration
# Fast and powerful Git hooks manager
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    prettier:
      # Run Prettier to format staged files
      run: npx prettier --write {staged_files}
      # Run on all supported file types
      glob: "*.{js,ts,jsx,tsx,html,scss,css,md,json,yml,yaml}"
      # Automatically stage formatted files
      stage_fixed: true
      # Custom failure message
      fail_text: "Prettier formatting failed. Please check the files."

    lint:
      # Run ESLint with --fix on staged TypeScript and HTML files only
      run: npx eslint --fix {staged_files}
      # ESLint only handles JS, TS, and Angular HTML
      glob: "*.{js,ts,html}"
      # Automatically stage fixed files
      stage_fixed: true
      # Custom failure message
      fail_text: "ESLint failed. Please fix the issues before committing."

    sonar-secrets:
      # Scan staged files for hardcoded secrets (SonarQube CLI)
      run: sonar analyze secrets {staged_files}
      # No glob: secrets hide in .env, yaml, json, config — not just source
      fail_text: "SonarQube found a hardcoded secret. Remove it before committing."

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
      fail_text: "Commit message must follow Conventional Commits (e.g. feat: add login)."

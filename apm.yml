name: copilot-workflow-demo
version: 1.0.0
description: Angular 22 + NgRx Signals workshop demo — agent config managed via APM
author: Daniel Sogl

# One source for Claude Code and Copilot (VS Code + CLI). APM deploys only the claude target, because
# every harness reads the Claude layout: .claude/agents, .claude/skills and the hooks in
# .claude/settings.json. VS Code also reads .claude/rules; the Copilot CLI does not, so it gets the same
# instructions from AGENTS.md, which VS Code skips (chat.useAgentsMdFile: false).
#   apm install && apm compile --target codex        # the codex compile writes only AGENTS.md
#
# Generated: .claude/rules, .claude/agents, .claude/skills, the hooks in .claude/settings.json,
# .mcp.json and AGENTS.md. Hand-owned: .vscode/settings.json, .vscode/mcp.json (VS Code's Local agent
# does not read .mcp.json), .github/lsp.json (the Copilot CLI reads repo LSP servers only from there —
# keep it in sync with dependencies.lsp) and the permissions / enabledMcpjsonServers /
# UserPromptSubmit parts of .claude/settings.json.
# No copilot target: VS Code would load .github/instructions and .github/agents on top of the .claude
# copies, and the only settings that prevented that (chat.*FilesLocations) are deprecated. The cloud
# agent therefore sees AGENTS.md and .claude/skills, but no hooks or custom agents.
#
# Rules that the generated output does not reveal:
#   - The UserPromptSubmit -> `codegraph prompt-hook` entry in .claude/settings.json is user-owned:
#     in the file, absent from the apm-hooks.json sidecar. It implements Claude's hook contract, so
#     it steps aside when COPILOT_CLI is set.
#   - Hook commands resolve scripts from the git root, not ${PLUGIN_ROOT}: APM rewrites that to
#     ${CLAUDE_PROJECT_DIR}, which VS Code does not set.
#   - Hook matchers stay ".*": the Copilot CLI skips hooks with an empty matcher and rejects "*" as an
#     invalid regex. Tool names differ per harness, so each script filters itself and reads both
#     payload shapes (tool_name/tool_input and toolName/toolArgs).
#   - Every instruction carries applyTo; repo-wide ones use "**", which Claude and VS Code load for
#     every request.
#   - No prompts: .prompt.md files do not exist in the Copilot CLI. Slash-command workflows are
#     skills in .apm/skills/ with disable-model-invocation. Keep tool names out of skills and agents —
#     each harness spells them differently.
#   - The unpinned-deps `apm install` warning is deliberate: apm.lock.yaml pins the SHAs and
#     neither skill repo publishes usable tags, so a pin could only freeze them.
#   - The generated .claude/skills/apm-lsp plugin needs /reload-plugins and a Claude started from
#     the repo root, otherwise the LSP servers never come up.

targets:
  - claude
includes: auto
dependencies:
  apm:
    - angular/skills/angular-developer
    - danielsogl/skills/skills/ngrx-signals
    - danielsogl/skills/skills/bdd
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
    - name: angular-cli
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@angular/cli"
        - mcp
    - name: playwright-test
      registry: false
      transport: stdio
      command: npx
      args:
        - playwright
        - run-test-mcp-server
    - name: codegraph
      registry: false
      transport: stdio
      command: codegraph
      args:
        - serve
        - --mcp
  # Spell the key `extensionToLanguage` here; APM emits it as `fileExtensions` on disk.
  # No standalone html server — `angular` covers .html, and the first server to claim an
  # extension wins, so a second one would never start.
  lsp:
    - name: typescript
      command: npx
      args: ["-y", "typescript-language-server", "--stdio"]
      extensionToLanguage:
        ".ts": typescript
        ".tsx": typescriptreact
        ".js": javascript
        ".jsx": javascriptreact
        ".mjs": javascript
        ".cjs": javascript
    - name: angular
      command: ./.github/scripts/ngserver-launch.sh
      extensionToLanguage:
        ".html": html
        ".ng.html": html
    - name: css
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-css-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".css": css
        ".scss": scss
    - name: json
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-json-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".json": json
        ".jsonc": jsonc
    - name: yaml
      command: npx
      args: ["-y", "yaml-language-server", "--stdio"]
      extensionToLanguage:
        ".yaml": yaml
        ".yml": yaml
scripts:
  codegraph-setup: codegraph init

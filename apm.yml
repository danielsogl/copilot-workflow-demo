name: copilot-workflow-demo
version: 1.0.0
description: Angular 22 + NgRx Signals workshop demo — agent config managed via APM
author: Daniel Sogl

# One branch serves Claude Code and Copilot (VS Code + CLI) from the same .apm/ sources. Everything
# under .github/, .claude/, .agents/ and .vscode/mcp.json is generated — edit .apm/ and this file.
# Hand-owned: .vscode/settings.json (keeps VS Code on the same file set the Copilot CLI loads) and
# the permissions / enabledMcpjsonServers / UserPromptSubmit parts of .claude/settings.json.
#
# No root AGENTS.md / CLAUDE.md on purpose: instructions live only in the path-scoped native rules.
# Compile one target at a time — a combined compile re-creates a full AGENTS.md (microsoft/apm#1678).
# Never with --clean: on a single target it deletes the other target's deployed files.
#   apm install && apm compile --target copilot && apm compile --target claude
#
# Rules that the generated output does not reveal:
#   - Never name a hook file *-<harness>-hooks.json. That routing is deprecated, and one such file
#     silently strips the generic hooks.json of the other harness. Keep one .apm/hooks/hooks.json
#     and treat "No drift detected" from `apm audit` as the regression check.
#   - The UserPromptSubmit -> `codegraph prompt-hook` entry in .claude/settings.json is user-owned:
#     in the file, absent from the apm-hooks.json sidecar. It implements Claude's hook contract
#     only, so making it an APM primitive would hand it to Copilot too.
#   - Hook matchers stay "": one hooks.json feeds both harnesses and their tool names differ.
#     Each script filters itself and reads both payload shapes: tool_name/tool_input (Claude,
#     VS Code) and toolName/toolArgs (Copilot CLI on the camelCase events APM emits).
#   - Every instruction carries applyTo; repo-wide ones use "**". Without it APM also folds the
#     text into .github/copilot-instructions.md and the Copilot CLI loads it twice. Claude loads
#     paths: ["**"] rules at session start, VS Code applies "**" to every request.
#   - No prompts: .prompt.md files do not exist in the Copilot CLI. Slash-command workflows are
#     skills in .apm/skills/ with disable-model-invocation, so every harness gets the same file.
#     Keep tool names out of skills and agents — each harness spells them differently.
#   - The unpinned-deps `apm install` warning is deliberate: apm.lock.yaml pins the SHAs and
#     neither skill repo publishes usable tags, so a pin could only freeze them.
#   - The generated .claude/skills/apm-lsp plugin needs /reload-plugins and a Claude started from
#     the repo root, otherwise the LSP servers never come up.

targets:
  - copilot
  - claude
includes: auto
dependencies:
  apm:
    - angular/skills/angular-developer
    - danielsogl/skills/skills/ngrx-signals
    - danielsogl/skills/skills/bdd
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
    - name: angular-cli
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@angular/cli"
        - mcp
    - name: playwright-test
      registry: false
      transport: stdio
      command: npx
      args:
        - playwright
        - run-test-mcp-server
    - name: codegraph
      registry: false
      transport: stdio
      command: codegraph
      args:
        - serve
        - --mcp
  # Spell the key `extensionToLanguage` here; APM emits it as `fileExtensions` on disk.
  # No standalone html server — `angular` covers .html, and the first server to claim an
  # extension wins, so a second one would never start.
  lsp:
    - name: typescript
      command: npx
      args: ["-y", "typescript-language-server", "--stdio"]
      extensionToLanguage:
        ".ts": typescript
        ".tsx": typescriptreact
        ".js": javascript
        ".jsx": javascriptreact
        ".mjs": javascript
        ".cjs": javascript
    - name: angular
      command: ./.github/scripts/ngserver-launch.sh
      extensionToLanguage:
        ".html": html
        ".ng.html": html
    - name: css
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-css-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".css": css
        ".scss": scss
    - name: json
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-json-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".json": json
        ".jsonc": jsonc
    - name: yaml
      command: npx
      args: ["-y", "yaml-language-server", "--stdio"]
      extensionToLanguage:
        ".yaml": yaml
        ".yml": yaml
scripts:
  codegraph-setup: codegraph init

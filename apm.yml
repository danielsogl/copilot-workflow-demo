name: copilot-workflow-demo
version: 1.0.0
description: Angular 22 + NgRx Signals workshop demo — agent config managed via APM
author: Daniel Sogl
# Single-branch, NATIVE-ONLY setup: `main` serves BOTH harnesses (Claude Code + GitHub Copilot /
# Copilot CLI) from these identical .apm/ sources. There is deliberately NO root AGENTS.md and NO
# root CLAUDE.md — every instruction lives in the deterministic, path-scoped native files:
#   Claude  → .claude/rules/*.md  (global rules load always; `paths:` rules load on matching files)
#   Copilot → .github/copilot-instructions.md (global) + .github/instructions/*.instructions.md (applyTo)
# Rationale (re-verified against APM 0.30): CLAUDE.md now dedups (it omits the instructions section
# when .claude/rules/ is populated), but root AGENTS.md is still all-or-nothing — a combined
# `apm compile --target copilot,claude` emits the full inline body incl. "## Files matching"
# (microsoft/apm issue #1678). Non-deterministic "Files matching" prose is exactly what we don't
# want, so we drop the root files entirely and rely on native rules.
#
# Regenerate after editing any .apm/ primitive or this file (per-target compile is REQUIRED — a bare
# `apm compile`/`--target copilot,claude` keeps a full AGENTS.md; only single-target compiles dedup it):
#   apm install                           # deps + MCP mirrors + LSP config — non-destructive
#   apm compile --target copilot          # .github/instructions/ + copilot-instructions.md (AGENTS.md stays absent)
#   apm compile --target claude           # .claude/rules/ (CLAUDE.md stays absent)
# Do NOT pass --clean with these per-target compiles: with a single target it deletes the OTHER target's
# deployed files (e.g. Claude's hook scripts under .claude/hooks/). Root AGENTS.md/CLAUDE.md are already
# removed and single-target compiles never regenerate them; if a stale one ever reappears, delete it once
# by hand (`rm -f AGENTS.md CLAUDE.md`), not with --clean.
#
# What `apm install` writes (APM 0.30 — all committed, all generated, never hand-edit):
#   .mcp.json                                 MCP servers for Claude Code
#   .vscode/mcp.json                          MCP servers for Copilot in VS Code
#   .github/mcp.json                          MCP servers for the Copilot coding agent (new in 0.30)
#   .github/lsp.json                          LSP servers for Copilot CLI
#   .claude/skills/apm-lsp/.claude-plugin/…   LSP servers for Claude Code, as a plugin (new in 0.29.1)
#     Activation is NOT automatic: needs Claude Code >= 2.1.157, an accepted workspace-trust prompt,
#     Claude started from the repo root (project plugins do not walk up from a subdirectory), and a
#     `/reload-plugins` or restart after each `apm install`. If two enabled servers claim the same
#     extension, the first one registered wins and the others never start.
#   .agents/skills/ + .claude/skills/         dependency skills, deployed to both locations
# Gotchas:
#   - `apm install` also tries to write the global ~/.copilot/mcp-config.json (Copilot CLI's user-level
#     MCP list). On this machine that path is a read-only nix/home-manager symlink, so install prints
#     `Permission denied` for it — HARMLESS: the committed project mirrors are written fine and are
#     authoritative. Manage the global copilot MCP list via nix if you need it.
#   - `.claude/settings.json` is a MERGE target. APM claims exactly the hook events listed in the
#     sibling .claude/apm-hooks.json sidecar and rewrites only those; everything else in the file is
#     preserved across installs (`enabledMcpjsonServers`, `permissions`, and any hook event the
#     sidecar does not list). Author shared hooks ONCE in .apm/hooks/hooks.json — never hand-add a
#     hook that APM also generates, that is what caused the earlier double-firing.
#   - The `UserPromptSubmit` -> `codegraph prompt-hook` entry is deliberately USER-OWNED: it is in
#     .claude/settings.json but NOT in the apm-hooks.json sidecar, so `apm install` leaves it alone.
#     It must not become an APM primitive, because `codegraph prompt-hook` implements Claude's
#     UserPromptSubmit contract only and a generic hooks.json would also hand it to Copilot.
#     If you ever re-add it to the sidecar by hand, APM will start managing (and can remove) it.
#   - NEVER use APM's hook filename routing (`*-<harness>-hooks.json`). It is deprecated in 0.30, and
#     worse: a single `-claude-` suffixed file in this package silently suppressed the generic
#     hooks.json for the Claude target entirely — a fresh `apm install` gave Copilot all three script
#     hooks and Claude none, and the stale entries only survived because APM never removes what it
#     did not just write. Keep ONE generic .apm/hooks/hooks.json. Per-file target restriction is not
#     expressible for a local package that serves both harnesses; a Claude-only hook goes in
#     .claude/settings.json as a user-owned entry instead (see the UserPromptSubmit gotcha above).
#     Regression check: `apm audit` must report "No drift detected".
#   - Hook matchers stay `""` in .apm/hooks/hooks.json on purpose: one hooks.json feeds both harnesses,
#     whose tool names differ (Bash vs runInTerminal, Edit/Write vs editFiles). Narrowing the matcher for
#     one breaks the other — each script self-filters on tool name / file extension instead.
#   - `.github/copilot/settings.json` (mergeStrategy) is the ONE hand-owned file APM cannot model — no
#     apm.yml field exists for it. Everything else is single-sourced.
#   - Trade-off: no universal AGENTS.md means non-Claude/Copilot tools (Codex, Cursor, Windsurf, …)
#     get no instructions. Acceptable here — this repo targets Claude Code + Copilot only.
# Which agent platforms this project supports (resolution order: --target flag > this field > auto-detect).
targets:
  - copilot
  - claude
# Local .apm/ primitives (instructions, skills, agents, prompts, hooks) deploy automatically.
includes: auto
dependencies:
  # External library skills — replace the formerly-vendored .agents/skills/* copies.
  # Tracks each repo's default branch; apm.lock.yaml pins the exact resolved SHA
  # (use `apm install --frozen` to reproduce, `apm update` to refresh).
  apm:
    - angular/skills/angular-developer
    - danielsogl/skills/skills/ngrx-signals
    - danielsogl/skills/skills/bdd
  # MCP servers — single source of truth. `apm install` regenerates the committed mirror files
  # .mcp.json (Claude) + .vscode/mcp.json (Copilot) from this list, non-destructively (APM 0.26+).
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp/oauth
    - name: angular-cli
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@angular/cli"
        - mcp
    - name: playwright-test
      registry: false
      transport: stdio
      command: npx
      args:
        - playwright
        - run-test-mcp-server
    # CodeGraph — tree-sitter knowledge graph (not in the MCP registry → self-defined).
    # `codegraph serve --mcp` is the stdio server; the index lives in .codegraph/ (gitignored).
    - name: codegraph
      registry: false
      transport: stdio
      command: codegraph
      args:
        - serve
        - --mcp
  # LSP servers — single source of truth for GitHub Copilot CLI's .github/lsp.json (written by
  # `apm install`). Use `extensionToLanguage` here (camelCase); APM emits it as `fileExtensions` on disk.
  # (html/css/json standalone server intentionally dropped — the `angular` server already handles .html.)
  lsp:
    - name: typescript
      command: npx
      args: ["-y", "typescript-language-server", "--stdio"]
      extensionToLanguage:
        ".ts": typescript
        ".tsx": typescriptreact
        ".js": javascript
        ".jsx": javascriptreact
        ".mjs": javascript
        ".cjs": javascript
    - name: angular
      command: ./.github/scripts/ngserver-launch.sh
      extensionToLanguage:
        ".html": html
        ".ng.html": html
    - name: css
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-css-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".css": css
        ".scss": scss
    - name: json
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-json-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".json": json
        ".jsonc": jsonc
    - name: yaml
      command: npx
      args: ["-y", "yaml-language-server", "--stdio"]
      extensionToLanguage:
        ".yaml": yaml
        ".yml": yaml
scripts:
  # Build/refresh the CodeGraph index: `apm run codegraph-setup`
  codegraph-setup: codegraph init

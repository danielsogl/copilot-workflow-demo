name: copilot-workflow-demo
version: 1.0.0
description: Angular 22 + NgRx Signals workshop demo — agent config managed via APM
author: Daniel Sogl
# Single-branch, NATIVE-ONLY setup: `main` serves BOTH harnesses (Claude Code + GitHub Copilot /
# Copilot CLI) from these identical .apm/ sources. There is deliberately NO root AGENTS.md and NO
# root CLAUDE.md — every instruction lives in the deterministic, path-scoped native files:
#   Claude  → .claude/rules/*.md  (global rules load always; `paths:` rules load on matching files)
#   Copilot → .github/copilot-instructions.md (global) + .github/instructions/*.instructions.md (applyTo)
# Rationale: APM's root AGENTS.md is all-or-nothing (full inline incl. "## Files matching" or absent);
# it cannot be trimmed to globals-only (microsoft/apm issue #1678). Non-deterministic "Files matching"
# prose is exactly what we don't want, so we drop the root files entirely and rely on native rules.
#
# Regenerate after editing any .apm/ primitive or this file (per-target compile is REQUIRED — a bare
# `apm compile`/`--target copilot,claude` keeps a full AGENTS.md; only single-target compiles dedup it):
#   apm install --only apm                # deploy primitives for both runtimes (no global MCP write)
#   apm compile --target copilot          # .github/instructions/ + copilot-instructions.md (AGENTS.md stays absent)
#   apm compile --target claude           # .claude/rules/ (CLAUDE.md stays absent)
# Do NOT pass --clean with these per-target compiles: with a single target it deletes the OTHER target's
# deployed files (e.g. Claude's hook scripts under .claude/hooks/). Root AGENTS.md/CLAUDE.md are already
# removed and single-target compiles never regenerate them; if a stale one ever reappears, delete it once
# by hand (`rm -f AGENTS.md CLAUDE.md`), not with --clean.
# Gotchas:
#   - `apm install` WITH mcp writes the read-only global ~/.copilot/mcp-config.json and aborts;
#     always use `--only apm`. Committed MCP config: .mcp.json (claude) + .vscode/mcp.json (copilot).
#   - `.claude/settings.json` is a MERGE target — APM (0.26+) manages only its own `matcher: "*"` hook
#     blocks and never removes others. Author hooks ONCE in .apm/hooks/hooks.json; never hand-add hook
#     blocks to settings.json (that is what caused the earlier double-firing).
#   - Trade-off: no universal AGENTS.md means non-Claude/Copilot tools (Codex, Cursor, Windsurf, …)
#     get no instructions. Acceptable here — this repo targets Claude Code + Copilot only.
# Which agent platforms this project supports (resolution order: --target flag > this field > auto-detect).
targets:
  - copilot
  - claude
# Local .apm/ primitives (instructions, skills, agents, prompts, hooks) deploy automatically.
includes: auto
dependencies:
  # External library skills — replace the formerly-vendored .agents/skills/* copies.
  # Tracks each repo's default branch; apm.lock.yaml pins the exact resolved SHA
  # (use `apm install --frozen` to reproduce, `apm update` to refresh).
  apm:
    - angular/skills/angular-developer
    - danielsogl/skills/skills/ngrx-signals
    - danielsogl/skills/skills/bdd
  # MCP servers — source of truth. NOTE: `apm install --only apm` (the safe flow) does NOT sync the
  # committed mirror files .mcp.json (Claude) and .vscode/mcp.json (Copilot). `apm install --only mcp`
  # would sync them but also triggers APM's destructive stale-file cleanup, so after editing this list
  # update both mirrors BY HAND to match (they are plain 1:1 mirrors of the entries below).
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp/oauth
    - name: angular-cli
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@angular/cli"
        - mcp
    - name: playwright-test
      registry: false
      transport: stdio
      command: npx
      args:
        - playwright
        - run-test-mcp-server
    # CodeGraph — tree-sitter knowledge graph (not in the MCP registry → self-defined).
    # `codegraph serve --mcp` is the stdio server; the index lives in .codegraph/ (gitignored).
    - name: codegraph
      registry: false
      transport: stdio
      command: codegraph
      args:
        - serve
        - --mcp
scripts:
  # Build/refresh the CodeGraph index: `apm run codegraph-setup`
  codegraph-setup: codegraph init

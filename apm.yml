name: copilot-workflow-demo
version: 1.0.0
description: Angular 22 + NgRx Signals workshop demo — agent config managed via APM
author: Daniel Sogl
# Single-branch, NATIVE-ONLY setup: `main` serves BOTH harnesses (Claude Code + GitHub Copilot /
# Copilot CLI) from these identical .apm/ sources. There is deliberately NO root AGENTS.md and NO
# root CLAUDE.md — every instruction lives in the deterministic, path-scoped native files:
#   Claude  → .claude/rules/*.md  (global rules load always; `paths:` rules load on matching files)
#   Copilot → .github/copilot-instructions.md (global) + .github/instructions/*.instructions.md (applyTo)
# Rationale: APM's root AGENTS.md is all-or-nothing (full inline incl. "## Files matching" or absent);
# it cannot be trimmed to globals-only (microsoft/apm issue #1678). Non-deterministic "Files matching"
# prose is exactly what we don't want, so we drop the root files entirely and rely on native rules.
#
# Regenerate after editing any .apm/ primitive or this file (per-target compile is REQUIRED — a bare
# `apm compile`/`--target copilot,claude` keeps a full AGENTS.md; only single-target compiles dedup it):
#   apm install                           # deps + MCP mirrors (.mcp.json + .vscode/mcp.json) + LSP (.github/lsp.json) — non-destructive in 0.26+
#   apm compile --target copilot          # .github/instructions/ + copilot-instructions.md (AGENTS.md stays absent)
#   apm compile --target claude           # .claude/rules/ (CLAUDE.md stays absent)
# Do NOT pass --clean with these per-target compiles: with a single target it deletes the OTHER target's
# deployed files (e.g. Claude's hook scripts under .claude/hooks/). Root AGENTS.md/CLAUDE.md are already
# removed and single-target compiles never regenerate them; if a stale one ever reappears, delete it once
# by hand (`rm -f AGENTS.md CLAUDE.md`), not with --clean.
# Gotchas:
#   - `apm install` also tries to write the global ~/.copilot/mcp-config.json (Copilot CLI's user-level
#     MCP list). On this machine that path is a read-only nix/home-manager symlink, so install prints
#     `Permission denied` for it — HARMLESS: the committed project mirrors (.mcp.json / .vscode/mcp.json)
#     are written fine and are authoritative. Manage the global copilot MCP list via nix if you need it.
#   - `.claude/settings.json` is a MERGE target — APM (0.26+) manages only its own `matcher: "*"` hook
#     blocks and never removes others. Author hooks ONCE in .apm/hooks/hooks.json; never hand-add hook
#     blocks to settings.json (that is what caused the earlier double-firing).
#   - `.github/copilot/settings.json` (mergeStrategy) is the ONE hand-owned file APM cannot model — no
#     apm.yml field exists for it (verified against APM 0.26 source). Everything else is single-sourced.
#   - Trade-off: no universal AGENTS.md means non-Claude/Copilot tools (Codex, Cursor, Windsurf, …)
#     get no instructions. Acceptable here — this repo targets Claude Code + Copilot only.
# Which agent platforms this project supports (resolution order: --target flag > this field > auto-detect).
targets:
  - copilot
  - claude
# Local .apm/ primitives (instructions, skills, agents, prompts, hooks) deploy automatically.
includes: auto
dependencies:
  # External library skills — replace the formerly-vendored .agents/skills/* copies.
  # Tracks each repo's default branch; apm.lock.yaml pins the exact resolved SHA
  # (use `apm install --frozen` to reproduce, `apm update` to refresh).
  apm:
    - angular/skills/angular-developer
    - danielsogl/skills/skills/ngrx-signals
    - danielsogl/skills/skills/bdd
    # --- Backend-Track (bosch): .NET 10 / C# unter backend/ ---
    # Ausschließlich aus dotnet/skills — dem offiziellen, microsoft-owned Repo.
    # Kein offizieller xUnit- oder Stryker-Skill vorhanden (dort MSTest-lastig);
    # die beiden sind Kandidaten für einen selbstgebauten Skill im Workshop.
    - dotnet/skills/plugins/dotnet-aspnetcore/skills/dotnet-webapi
    - dotnet/skills/plugins/dotnet-test/skills/test-anti-patterns
    - dotnet/skills/plugins/dotnet-test/skills/find-untested-sources
    - dotnet/skills/plugins/dotnet-test/skills/generate-testability-wrappers
    - dotnet/skills/plugins/dotnet-test/skills/coverage-analysis
    - dotnet/skills/plugins/dotnet-test/skills/grade-tests
    # --- Die SDD-Kette aus dem Deck (Tag 2), Matt Pocock ---
    - mattpocock/skills/skills/engineering/grill-with-docs
    - mattpocock/skills/skills/engineering/to-spec
    - mattpocock/skills/skills/engineering/to-tickets
    - mattpocock/skills/skills/engineering/implement
    - mattpocock/skills/skills/engineering/tdd
    - mattpocock/skills/skills/engineering/code-review
  # MCP servers — single source of truth. `apm install` regenerates the committed mirror files
  # .mcp.json (Claude) + .vscode/mcp.json (Copilot) from this list, non-destructively (APM 0.26+).
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp/oauth
    - name: angular-cli
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@angular/cli"
        - mcp
    - name: playwright-test
      registry: false
      transport: stdio
      command: npx
      args:
        - playwright
        - run-test-mcp-server
    # CodeGraph — tree-sitter knowledge graph (not in the MCP registry → self-defined).
    # `codegraph serve --mcp` is the stdio server; the index lives in .codegraph/ (gitignored).
    - name: codegraph
      registry: false
      transport: stdio
      command: codegraph
      args:
        - serve
        - --mcp
  # LSP servers — single source of truth for GitHub Copilot CLI's .github/lsp.json (written by
  # `apm install`). Use `extensionToLanguage` here (camelCase); APM emits it as `fileExtensions` on disk.
  # (html/css/json standalone server intentionally dropped — the `angular` server already handles .html.)
  lsp:
    - name: typescript
      command: npx
      args: ["-y", "typescript-language-server", "--stdio"]
      extensionToLanguage:
        ".ts": typescript
        ".tsx": typescriptreact
        ".js": javascript
        ".jsx": javascriptreact
        ".mjs": javascript
        ".cjs": javascript
    - name: angular
      command: ./.github/scripts/ngserver-launch.sh
      extensionToLanguage:
        ".html": html
        ".ng.html": html
    - name: css
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-css-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".css": css
        ".scss": scss
    - name: json
      command: npx
      args:
        [
          "-y",
          "--package=vscode-langservers-extracted",
          "vscode-json-language-server",
          "--stdio",
        ]
      extensionToLanguage:
        ".json": json
        ".jsonc": jsonc
    - name: yaml
      command: npx
      args: ["-y", "yaml-language-server", "--stdio"]
      extensionToLanguage:
        ".yaml": yaml
        ".yml": yaml
scripts:
  # Build/refresh the CodeGraph index: `apm run codegraph-setup`
  codegraph-setup: codegraph init
